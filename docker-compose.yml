# Local development database.
# Setup: copy .env.example to .env and set MSSQL_SA_PASSWORD, then run `docker compose up -d`.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmacia-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      # 14330 on the host so it does not clash with a locally installed SQL Server on 1433.
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
