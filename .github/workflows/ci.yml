# Every push to main and every pull request: the backend with its tests (integration tests on a real SQL Server
# through Testcontainers), the frontend, and the whole app end to end in the same containers that go to production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Farmacia.slnx
      # TreatWarningsAsErrors (Directory.Build.props): an analyzer warning or a vulnerable package fails the build.
      - run: dotnet build Farmacia.slnx --configuration Release --no-restore
      # Infrastructure and API tests start their own SQL Server container (Docker is available on the runner).
      - run: dotnet test Farmacia.slnx --configuration Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: test-results

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # What ships to the browser must have no known vulnerabilities (dev tooling is reviewed by Dependabot).
      - run: npm audit --omit=dev

  e2e:
    name: End to end (Playwright on the production containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Local secrets for this run only
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=Ci_${{ github.run_id }}_Str0ng!
          JWT_SIGNING_KEY=$(openssl rand -base64 32)
          BOOTSTRAP_ADMIN_EMAIL=admin@farmacia.local
          BOOTSTRAP_ADMIN_PASSWORD=Inicial2026
          EOF
      - name: Start the app as in production
        run: |
          docker compose --profile app up --detach --build
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 3; done'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: App logs
        if: failure()
        run: docker compose --profile app logs app migrate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
